services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fidus_os}
      POSTGRES_USER: ${POSTGRES_USER:-fidus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CAMBIAR_CONTRASENA_POSTGRES_SEGURA}
    volumes:
      - fidus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fidus} -d ${POSTGRES_DB:-fidus_os}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - fidus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PRELAUNCH_MODE: ${PRELAUNCH_MODE:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fidus}:${POSTGRES_PASSWORD:-CAMBIAR_CONTRASENA_POSTGRES_SEGURA}@postgres:5432/${POSTGRES_DB:-fidus_os}
      REDIS_URL: redis://redis:6379/0
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${FIDUS_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "worker"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PRELAUNCH_MODE: ${PRELAUNCH_MODE:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fidus}:${POSTGRES_PASSWORD:-CAMBIAR_CONTRASENA_POSTGRES_SEGURA}@postgres:5432/${POSTGRES_DB:-fidus_os}
      REDIS_URL: redis://redis:6379/0
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FIDUS_WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fidus_postgres_data:
  fidus_redis_data:
